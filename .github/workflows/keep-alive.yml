name: Keep Render app awake
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, comfortably under Render's 15-min sleep threshold
  workflow_dispatch: {}       # allows manual trigger for testing
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf "${{ secrets.RENDER_APP_URL }}/api/v1/health" || exit 1
